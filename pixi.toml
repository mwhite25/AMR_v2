[workspace]
name = "amr"
version = "2"
description = "Antimicrobial Resistance with DNABERT"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"] # ["win-64", "linux-64", "osx-64", "osx-arm64"]

[dependencies]
python = ">=3.12"
pandas = "*"
numpy = "*"
psutil = "*"
biopython = "*"
joblib = "*"
tqdm = "*"
pip = "*"
pyarrow = ">=25.0.0,<26"
ipykernel = ">=7.3.0,<8"
jupyterlab = ">=4.6.3,<5"
matplotlib = ">=3.11.1,<4"
sra-tools = ">=3.4.1,<4"
fastp = ">=1.3.7,<2"
spades = ">=4.3.0,<5"
blast = ">=2.17.0,<3"
pytorch = ">=2.13.0,<3"
transformers = "<5"
peft = ">=0.20.0,<0.21"
wandb = ">=0.30.0,<0.31"
sentencepiece = ">=0.2.1,<0.3"
einops = ">=0.8.2,<0.9"
scikit-learn = ">=1.9.1,<2"

